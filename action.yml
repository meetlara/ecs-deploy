name: "Build image and deploy to ECS"
description: "Builds de image, uploads to ECR, updates the task definition and deploys new service on ECS"
inputs:
  aws_access_key_id:
    description: AWS Key ID
    required: true
  aws_secret_access_key:
    description: AWS Secret Access Key
    required: true
  ecr_image_name:
    description: Define the name of the ECR image registry
    required: true
  ecr_image_tag:
    description: Define the tag of the image
    required: true
  task_definition_container_name:
    description: Define the name of the container in the Task Definition
    required: true
  ecs_service_name:
    description: Define the name of the ECS Service
    required: true
  ecs_cluster_name:
    description: Define the name of the ECS Cluster
    required: true
  task_definition_path:
    description: Define the path to the Task Definition
    required: true
  build_working_directory:
    description: Define the path of working directory of code to build Docker image
    required: true
  docker_build_extra_args:
    description: Define the extra arguments that you will set to docker build command
    required: false
    default: ""
  second_task_definition_path:
    description: Define the path to the Task Definition
    required: false
  second_task_definition_container_name:
    description: Define the name of the container in the Task Definition
    required: false
  second_ecs_service_name:
    description: Define the name of the ECS Service
    required: false
  second_ecs_cluster_name:
    description: Define the name of the ECS Cluster
    required: false
runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        mask-password: 'false' # TODO: delete to change to 'true' by default (migration v1 to v2)

    # Exposes ACTIONS_RUNTIME_TOKEN / ACTIONS_RESULTS_URL so the raw `docker buildx build`
    # below can talk to the GitHub Actions cache (type=gha). Normal `run:` steps don't get
    # these vars; a JS action does. We use first-party actions/github-script instead of a
    # third-party action so the runtime token is never handed to an external dependency.
    - name: Expose GitHub Actions runtime
      uses: actions/github-script@v9
      with:
        script: |
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '')

    # This is a separate action that sets up buildx runner
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build, tag, and push image to Amazon ECR
      shell: bash
      id: build-image
      working-directory: ${{ inputs.build_working_directory }}
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_NAME: ${{ inputs.ecr_image_name }}
        IMAGE_TAG: ${{ inputs.ecr_image_tag }}
        DOCKER_BUILD_EXTRA_ARGS: ${{ inputs.docker_build_extra_args }}
      run: |
        cache_commit=$(aws ecr describe-images --repository-name $IMAGE_NAME --query "[imageDetails[?imageTags[0]=='$IMAGE_TAG'].imageTags[0]][] | [0]" --output=text)
        echo "Got latest docker image on repository. Tag: $cache_commit"
        
        if [ "$cache_commit" = "$IMAGE_TAG" ]; then
            echo "Already existed image; skipping."
        else
          tmp_dir="/tmp/ecs-deploy-$(date +%s)"
          mkdir -p $tmp_dir;

          # GitHub Actions cache (type=gha). It's repo-scoped by GitHub, and we further
          # scope by image name so multiple images in the same repo don't clobber each
          # other. NOTE: mode=max intentionally omitted — it triggers a 400 error against
          # the GHA cache backend (docker/buildx#841). Default mode=min caches the same
          # layers here anyway since the Dockerfile is single-stage.
          /usr/bin/docker buildx build \
            --cache-from "type=gha,scope=$IMAGE_NAME" \
            --cache-to "type=gha,scope=$IMAGE_NAME,ignore-error=true" \
            $DOCKER_BUILD_EXTRA_ARGS \
            --iidfile $tmp_dir/iidfile \
            --tag $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG \
            --metadata-file $tmp_dir/metadata-file \
            --push .

          rm -rf $tmp_dir
        fi

        echo "image=$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ inputs.task_definition_path }}
        container-name: ${{ inputs.task_definition_container_name }}
        image: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_image_name }}:${{ inputs.ecr_image_tag }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ inputs.ecs_service_name }}
        cluster: ${{ inputs.ecs_cluster_name }}
        
    - name: Fill in the new image ID in the Amazon ECS task definition (second service)
      id: sec-task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      if: ${{ inputs.second_task_definition_path != '' }}
      with:
        task-definition: ${{ inputs.second_task_definition_path }}
        container-name: ${{ inputs.second_task_definition_container_name }}
        image: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_image_name }}:${{ inputs.ecr_image_tag }}

    - name: Deploy Amazon ECS task definition (second service)
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      if: ${{ inputs.second_task_definition_path != '' }}
      with:
        task-definition: ${{ steps.sec-task-def.outputs.task-definition }}
        service: ${{ inputs.second_ecs_service_name }}
        cluster: ${{ inputs.second_ecs_cluster_name }}
